<!-- PAGE TEMPLATE — design A, "Poster". The blank page an extension starts from:
     this design's masthead, nav and footer around an empty {{CONTENT}}.
     Filled by the site builder: {{TITLE}} {{SUBTITLE}} {{CONTENT}} {{NAV}} {{FEED_URL}}
     {{REPO_URL}} {{YEAR}}, and {{ROOT}} — "" for a page at the top of site/, "../"
     for one a folder down. Filled once at setup: Eira curious.eira@gmail.com
     Divina.

     EXTENSION CONTENT GOES IN {{CONTENT}}. Write it in this vocabulary, which every
     design styles, and it will look at home whichever design the agent has:
       <section class="ext-block" data-extension="<name>">  one block of the page
         <h2 class="ext-label">…</h2>                        its heading
         <p class="ext-note">…</p>                           a short line of context
         <figure class="ext-lead">…<figcaption>…</figcaption></figure>   one big figure
         <div class="ext-grid"> <figure>…</figure> … </div>   figures two to a row
         <p>, <ul>, <blockquote>, <table>                    ordinary text
         <nav class="pager"><a class="back">‹ Back</a><span class="where">…</span>
                            <a class="next">Next ›</a></nav>  between pages; a
                            <span class="back|next" aria-disabled="true"> where there is none
       </section>
     Anything particular to the extension (a frame around a photograph, say) it
     brings in its own <style>, scoped under its own class. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} — Eira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500&family=Inter:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
    /* PALETTE:START  (schemes: site/templates/palettes.md) */
      --bg: #fdfcfa;
      --text: #1e1e1e;
      --muted: #5e5e5e;
      --accent: #3b6b7d;
      --accent-warm: #c06c4a;
      --accent-glow: #f2e3d5;
      --card-bg: #f7f5f1;
      --card-hover: #f0ede7;
      --rule: #e2ded7;
      --btn-bg: #3b6b7d;
      --btn-text: #fff;
      --btn-hover: #305a6a;
      --title: #c8520f;
      --ground: #f6e0cf;
    /* PALETTE:END */

      --display: "Anton", "Oswald", Impact, sans-serif;
      --label: "Oswald", "Arial Narrow", sans-serif;
      --body: "Inter", -apple-system, "Segoe UI", sans-serif;
      --paper: var(--ground, color-mix(in srgb, var(--accent-glow) 62%, #f6f2ea));
      --ink: var(--text);
      --line: 2px solid var(--ink);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--body); background: var(--paper); color: var(--ink); line-height: 1.55; padding: 0 1rem; }
    a { color: inherit; }
    .sheet { max-width: 1040px; margin: 0 auto; padding: 2.5rem 0 3rem; min-height: 100vh; display: flex; flex-direction: column; }

    .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding-bottom: 1.1rem; border-bottom: var(--line); }
    .masthead .mark { font-family: var(--display); font-size: 1.6rem; text-transform: uppercase; text-decoration: none; }
    .masthead .mark span { color: var(--accent); }
    nav.site { display: flex; gap: 0.4rem 1.4rem; flex-wrap: wrap; font-family: var(--label); text-transform: uppercase; letter-spacing: 0.22em; font-size: 0.8rem; }
    nav.site a { text-decoration: none; padding-bottom: 2px; border-bottom: 2px solid transparent; }
    nav.site a:hover { border-color: var(--accent); color: var(--accent); }

    .page-head { padding: 3rem 0 2.25rem; }
    .page-head h1 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(3.4rem, 12vw, 8rem); line-height: 0.9; }
    .page-head h1::after { content: "."; color: var(--accent); }
    .page-head .dek { margin-top: 1.1rem; font-weight: 700; font-style: italic; font-size: clamp(1.15rem, 2.6vw, 1.5rem); max-width: 36ch; }
    .page-head .dek:empty { display: none; }

    /* ── The extension vocabulary ── */
    main { font-size: 1.05rem; line-height: 1.7; }
    .ext-block + .ext-block { margin-top: 4rem; }
    .ext-label { display: flex; align-items: baseline; justify-content: space-between; font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(2rem, 5.5vw, 3.2rem); line-height: 1; padding-bottom: 0.6rem; border-bottom: var(--line); margin-bottom: 1.5rem; }
    .ext-note { max-width: none; font-family: var(--label); text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.8rem; color: var(--muted); padding: 0.85rem 0; border-top: var(--line); border-bottom: var(--line); margin-bottom: 2rem; }
    main p, main ul, main ol, main blockquote, main table { max-width: 40rem; }
    main p + p, main p + ul, main ul + p { margin-top: 1em; }
    main ul, main ol { padding-left: 1.4rem; }
    main blockquote { border-left: 4px solid var(--accent); padding-left: 1.25rem; font-style: italic; }
    main a { color: var(--accent); }
    main figure { margin: 0; }
    .ext-lead { margin-bottom: 2.25rem; }
    .ext-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2.25rem 1.75rem; }
    main figcaption { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.2rem 1rem; margin-top: 0.7rem; font-family: var(--label); text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.78rem; color: var(--muted); }
    main figcaption :first-child { color: var(--ink); }
    main img { max-width: 100%; height: auto; display: block; }

    nav.pager { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 3rem; border-top: var(--line); border-bottom: var(--line); }
    nav.pager > * { padding: 1rem 0; font-family: var(--display); text-transform: uppercase; font-size: 1.5rem; text-decoration: none; }
    nav.pager .next { text-align: right; }
    nav.pager a:hover { color: var(--accent); }
    nav.pager [aria-disabled="true"] { opacity: 0.25; }
    nav.pager .where { font-family: var(--label); font-size: 0.8rem; letter-spacing: 0.2em; color: var(--muted); padding: 0 1rem; }

    footer { margin-top: auto; padding-top: 4rem; }
    footer .inner { border-top: var(--line); padding-top: 1.1rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-family: var(--label); text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.8rem; color: var(--muted); }
    footer a { text-decoration: none; }
    footer a:hover { color: var(--accent); }

    @media (max-width: 640px) {
      .sheet { padding-top: 1.5rem; }
      .page-head { padding-top: 2rem; }
      .ext-grid { grid-template-columns: 1fr; }
      nav.pager > * { font-size: 1.2rem; }
    }
  </style>
