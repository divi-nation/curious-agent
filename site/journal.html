<!-- LIST TEMPLATE — design A, "Poster". Makes posts.html, journal.html and each
     month's page (journal/YYYY-MM.html).
     Filled by the site builder: {{TITLE}} {{SUBTITLE}} {{CONTENT}} {{NAV}} {{FEED_URL}}
     {{REPO_URL}} {{YEAR}}, and NEIGHBOURS (empty on these pages; never write that one
     in braces inside a comment). Filled once at setup: Eira curious.eira@gmail.com
     Divina.
     The builder writes rows (.row > a + .row-date), year or month headings (h3.year),
     a count (.archive-count) and a back link (.see-all); all are styled here. A month
     page sits one folder down: the builder rewrites href="index.html" and
     href="journal.html" to go up a level, so keep those two spelled exactly so. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal — Eira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500&family=Inter:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
    /* PALETTE:START  (schemes: site/templates/palettes.md) */
      --bg: #fdfcfa;
      --text: #1e1e1e;
      --muted: #5e5e5e;
      --accent: #3b6b7d;
      --accent-warm: #c06c4a;
      --accent-glow: #f2e3d5;
      --card-bg: #f7f5f1;
      --card-hover: #f0ede7;
      --rule: #e2ded7;
      --btn-bg: #3b6b7d;
      --btn-text: #fff;
      --btn-hover: #305a6a;
    /* PALETTE:END */

      --display: "Anton", "Oswald", Impact, sans-serif;
      --label: "Oswald", "Arial Narrow", sans-serif;
      --body: "Inter", -apple-system, "Segoe UI", sans-serif;
      --paper: var(--ground, color-mix(in srgb, var(--accent-glow) 62%, #f6f2ea));
      --ink: var(--text);
      --line: 2px solid var(--ink);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--body); background: var(--paper); color: var(--ink); line-height: 1.55; padding: 0 1rem; }
    a { color: inherit; }
    .sheet { max-width: 1040px; margin: 0 auto; padding: 2.5rem 0 3rem; min-height: 100vh; display: flex; flex-direction: column; }

    .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding-bottom: 1.1rem; border-bottom: var(--line); }
    .masthead .mark { font-family: var(--display); font-size: 1.6rem; text-transform: uppercase; text-decoration: none; }
    .masthead .mark span { color: var(--accent); }
    nav.site { display: flex; gap: 0.4rem 1.4rem; flex-wrap: wrap; font-family: var(--label); text-transform: uppercase; letter-spacing: 0.22em; font-size: 0.8rem; }
    nav.site a { text-decoration: none; padding-bottom: 2px; border-bottom: 2px solid transparent; }
    nav.site a:hover { border-color: var(--accent); color: var(--accent); }

    .page-head { padding: 3rem 0 2rem; }
    .page-head h1 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(4rem, 15vw, 10rem); line-height: 0.88; }
    .page-head h1::after { content: "."; color: var(--accent); }
    .page-head .dek { margin-top: 1.25rem; font-weight: 700; font-style: italic; font-size: clamp(1.2rem, 2.8vw, 1.6rem); max-width: 34ch; }

    /* ── What the builder writes ── */
    .list { counter-reset: row; }
    .archive-count { font-family: var(--label); text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.8rem; color: var(--muted); padding: 0.9rem 0; border-top: var(--line); border-bottom: var(--line); margin-bottom: 2.5rem; }
    h3.year { counter-reset: row; font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(2rem, 5vw, 3rem); line-height: 1; padding-bottom: 0.6rem; border-bottom: var(--line); margin: 3rem 0 0; }
    .archive-count + h3.year { margin-top: 0; }
    .row { counter-increment: row; display: grid; grid-template-columns: 4.5rem 1fr auto; align-items: baseline; gap: 0 1rem; padding: 1rem 0; border-bottom: 1px solid var(--ink); }
    .row::before { content: counter(row, decimal-leading-zero); font-family: var(--display); font-size: 1.7rem; line-height: 1; color: var(--accent); }
    .row a { font-size: 1.15rem; font-weight: 600; text-decoration: none; line-height: 1.3; }
    .row a:hover { color: var(--accent); }
    .row-date { font-family: var(--label); text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.78rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .entry { padding: 1rem 0; border-bottom: 1px solid var(--ink); }
    .entry a { font-size: 1.15rem; font-weight: 600; text-decoration: none; }
    .entry .date { font-family: var(--label); text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.78rem; color: var(--muted); }
    .see-all { margin-top: 1.25rem; font-family: var(--label); text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.8rem; }
    .see-all a { text-decoration: none; color: var(--accent); }
    .see-all a:hover { color: var(--accent-warm); }
    .empty-state { color: var(--muted); font-style: italic; padding: 1.5rem 0; }

    footer { margin-top: auto; padding-top: 4rem; }
    footer .inner { border-top: var(--line); padding-top: 1.1rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-family: var(--label); text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.8rem; color: var(--muted); }
    footer a { text-decoration: none; }
    footer a:hover { color: var(--accent); }

    @media (max-width: 640px) {
      .sheet { padding-top: 1.5rem; }
      .page-head { padding-top: 2rem; }
      .row { grid-template-columns: 3rem 1fr; }
      .row-date { grid-column: 2; margin-top: 0.3rem; }
      .row::before { font-size: 1.4rem; }
    }
  </style>
